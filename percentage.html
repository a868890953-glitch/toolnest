<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percentage Calculator - ToolNest</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #1e293b;
      text-align: center;
      padding: 40px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    #result {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🧮 Percentage Calculator</h1>

    <input type="number" id="number" placeholder="Enter number">
    <input type="number" id="total" placeholder="Enter total">

    <br>

    <button onclick="calculate()">Calculate Percentage</button>

    <div id="result"></div>

    <a href="index.html">← Back to ToolNest</a>
  </div>

  <script>
    function calculate() {
      let number = Number(document.getElementById("number").value);
      let total = Number(document.getElementById("total").value);

      if (total <= 0 || number < 0) {
        document.getElementById("result").innerText =
          "Please enter valid numbers.";
        return;
      }

      let percentage = (number / total) * 100;

      document.getElementById("result").innerText =
        "Percentage: " + percentage.toFixed(2) + "%";
    }
  </script>

</body>
</html>
