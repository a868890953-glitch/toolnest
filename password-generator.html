<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator - ToolNest</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f8fc;
      color: #1e293b;
      text-align: center;
      padding: 40px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 12px 25px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f1f5f9;
      border-radius: 8px;
      word-break: break-all;
      font-weight: bold;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🔐 Password Generator</h1>

    <p>Choose password length:</p>

    <input type="number" id="length" value="12" min="4" max="50">

    <br>

    <button onclick="generatePassword()">Generate Password</button>

    <div id="result">Your password will appear here.</div>

    <a href="index.html">← Back to ToolNest</a>
  </div>

  <script>
    function generatePassword() {
      let length = Number(document.getElementById("length").value);

      if (length < 4 || length > 50) {
        document.getElementById("result").innerText =
          "Please choose a length between 4 and 50.";
        return;
      }

      const characters =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

      let password = "";

      const randomValues = new Uint32Array(length);
      crypto.getRandomValues(randomValues);

      for (let i = 0; i < length; i++) {
        password += characters[randomValues[i] % characters.length];
      }

      document.getElementById("result").innerText = password;
    }
  </script>

</body>
</html>
